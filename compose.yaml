services:
  postgres:
    image: postgres:17.6
    environment:
      POSTGRES_DB: orbit_web
      POSTGRES_USER: orbit
      POSTGRES_PASSWORD: orbit
    ports:
      - "5432:5432"

    volumes:
      - orbit-postgres-data:/var/lib/postgresql/data

    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U orbit -d orbit_web" ]
      interval: 5s
      timeout: 3s
      retries: 10


volumes:
  orbit-postgres-data: